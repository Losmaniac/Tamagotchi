name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # format, lint, typecheck, unit tests with coverage, build, bundle budget
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
