<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ff6fb5" />
    <meta name="description" content="Hatch, raise and care for your own 3D pocket pet." />
    <meta name="mobile-web-app-capable" content="yes" />

    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />

  <body>
    <div id="root">
      <!-- Static splash: paints instantly, replaced when the app mounts. -->
      <div
        style="
          height: 100%;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 12px;
          background: linear-gradient(180deg, #ffd8c2, #ffb3c6);
          font-family: ui-rounded, system-ui, sans-serif;
          color: #2b1a3d;
        "
      >
        <img src="/icons/icon.svg" width="112" height="112" alt="" style="border-radius: 28px" />

    </div>
    <script type="module" src="/src/main.tsx"></script>
