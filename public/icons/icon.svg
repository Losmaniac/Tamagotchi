<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd1ea"/>
      <stop offset="1" stop-color="#c9b8ff"/>
    </linearGradient>
    <radialGradient id="fur" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#ffb36b"/>
      <stop offset="1" stop-color="#ff7a3d"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g id="pet" transform="translate(256 270) scale(1)">
    <ellipse cx="0" cy="150" rx="120" ry="18" fill="#7a4fd6" opacity="0.18"/>
    <!-- ears -->
    <path d="M-120 -60 L-140 -175 L-40 -120 Z" fill="url(#fur)" stroke="#e85c22" stroke-width="6" stroke-linejoin="round"/>
    <path d="M120 -60 L140 -175 L40 -120 Z" fill="url(#fur)" stroke="#e85c22" stroke-width="6" stroke-linejoin="round"/>
    <path d="M-110 -85 L-122 -150 L-65 -118 Z" fill="#ffd0e4"/>
    <path d="M110 -85 L122 -150 L65 -118 Z" fill="#ffd0e4"/>
    <!-- head -->
    <ellipse cx="0" cy="0" rx="150" ry="132" fill="url(#fur)" stroke="#e85c22" stroke-width="6"/>
    <ellipse cx="0" cy="58" rx="78" ry="52" fill="#fff3e6"/>
    <!-- eyes -->
    <ellipse cx="-56" cy="-8" rx="26" ry="34" fill="#2b1a3d"/>
    <ellipse cx="56" cy="-8" rx="26" ry="34" fill="#2b1a3d"/>
    <circle cx="-64" cy="-20" r="10" fill="#fff"/>
    <circle cx="48" cy="-20" r="10" fill="#fff"/>
    <circle cx="-48" cy="4" r="5" fill="#fff"/>
    <circle cx="64" cy="4" r="5" fill="#fff"/>
    <!-- blush -->
    <ellipse cx="-98" cy="38" rx="22" ry="12" fill="#ff5fa2" opacity="0.55"/>
    <ellipse cx="98" cy="38" rx="22" ry="12" fill="#ff5fa2" opacity="0.55"/>
    <!-- nose + mouth -->
    <path d="M-10 30 L10 30 L0 42 Z" fill="#ff5fa2"/>
    <path d="M0 42 Q-14 62 -30 52 M0 42 Q14 62 30 52" fill="none" stroke="#2b1a3d" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
